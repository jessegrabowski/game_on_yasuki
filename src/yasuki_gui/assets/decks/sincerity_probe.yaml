name: sincerity_probe
author: Jesse
date: 2026-08-14

# A bench for Shrine of Sincerity: recruit it, then bow it in the Dynasty phase and check that the
# target list holds only the Sincerity cards face-up in a Province.
#
# Every Dynasty card is an unaligned Holding, so nothing is gated behind Family Honor or a clan
# surcharge, and each is either a legal target or a deliberate near-miss. Four Provinces show at a
# time out of ten cards, so the Shrine runs three deep to put one on the board most openings — it
# is Unique in play, not in the deck.

Pre-Game: # (1)
  # Strongholds (1) — 4 Gold Production, enough to recruit the Shrine on turn one
  - The Dark Capital of the Spider [Shattered Empire]

Dynasty: # (10)
  # The ability under test (3)
  - 3x Shrine of Sincerity [Gates of Tengoku]

  # Valid targets (4) — Sincerity, so they take a seeded token while in a Province
  - 2x Den of Needful Things [Chaos Reigns Part I]
  - 2x Hasty Memorial [Rise of Otosan Uchi]

  # Invalid targets (3) — Holdings in a Province carrying no Sincerity keyword
  - 2x Modest Farm [Rise of Jigoku]
  - Moto Traders [Chaos Reigns Part III]

Fate: # (10)
  - 3x Hired Killer [Shattered Empire]
  - 3x Refugees [Shattered Empire]
  - 2x Uncertainty [Shattered Empire]
  - 2x Overwhelmed [Gathering Storms]
