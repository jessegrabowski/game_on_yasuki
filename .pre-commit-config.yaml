repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-yaml
    -   id: debug-statements
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

- repo: https://github.com/asottile/pyupgrade
  rev: v3.20.0
  hooks:
    - id: pyupgrade
      args: [--py312-plus]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.8
  hooks:
    - id: ruff
      args: [ --fix, --exit-non-zero-on-fix ]
      exclude: \.md$
    - id: ruff-format
      types_or: [ python, pyi ]

- repo: https://github.com/MarcoGorelli/absolufy-imports
  rev: v0.3.1
  hooks:
    - id: absolufy-imports
      types: [python]

- repo: local
  hooks:
    - id: card-registry
      name: card handlers name real cards
      # Needs the project environment, which CI's pre-commit job does not have; the pytest test in
      # tests/yasuki_core/engine/rules/test_card_registry.py is what guards this in CI.
      entry: python -m yasuki_core.engine.rules.card_registry
      language: system
      pass_filenames: false
      # The card data matters as much as the handlers: renaming a card orphans every handler
      # keyed on its old id.
      files: ^src/yasuki_core/(engine/rules/|assets/database/card_ids\.txt$)
