name: Read the Docs PR preview

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    # Only fire when something that could change the docs build is touched.
    paths:
      - "docs/**"
      - ".readthedocs.yaml"
      - "pyproject.toml"
      - "src/**"

permissions:
  pull-requests: write

jobs:
  documentation-links:
    runs-on: ubuntu-latest
    steps:
      - uses: readthedocs/actions/preview@b8bba1484329bda1a3abe986df7ebc80a8950333 # v1.5
        with:
          project-slug: "game-on-yasuki"
